name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: '33.0.2'

      - name: Install npm dependencies
        working-directory: .
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android 2>/dev/null || true
          
      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 注入摄像头、震动、Wake Lock 权限
          if ! grep -q "CAMERA" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.INTERNET"|' "$MANIFEST"
          fi
          echo "=== AndroidManifest.xml (permissions) ==="
          grep "uses-permission" "$MANIFEST"

      - name: Sync web assets
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             confined-space-monitor-v1.0-debug.apk
          echo "APK size: $(du -sh confined-space-monitor-v1.0-debug.apk)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 有限空间监控-debug-apk
          path: confined-space-monitor-v1.0-debug.apk
          retention-days: 90

      - name: Summary
        run: |
          echo "## ✅ APK 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 信息 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| App 名称 | 有限空间作业监控 |" >> $GITHUB_STEP_SUMMARY
          echo "| 包名 | com.confinedspace.monitor |" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 | v1.0 Debug |" >> $GITHUB_STEP_SUMMARY
          echo "| APK 大小 | $(du -sh confined-space-monitor-v1.0-debug.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👇 在下方 **Artifacts** 区域下载 APK 安装包" >> $GITHUB_STEP_SUMMARY
